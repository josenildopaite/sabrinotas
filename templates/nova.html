{% extends "base.html" %}

{% block conteudo %}

<h3 class="mb-4">➕ Nova Nota</h3>

<form method="POST" onsubmit="salvarConteudo()">

    <div class="mb-3">
        <label class="form-label">Título</label>
        <input type="text" name="titulo" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Categoria</label>

        <select name="categoria" id="categoria" class="form-select" onchange="mostrarNovaCategoria()">
            <option value="">Sem categoria</option>

            {% for categoria in categorias %}
                <option value="{{ categoria[0] }}">{{ categoria[0] }}</option>
            {% endfor %}

            <option value="__nova__">➕ Criar nova categoria...</option>
        </select>
    </div>

    <div class="mb-3" id="campoNovaCategoria" style="display:none;">
        <label class="form-label">Nova categoria</label>
        <input type="text"
       name="nova_categoria"
       id="nova_categoria"
       class="form-control"
       placeholder="Digite o nome da nova categoria"
       style="text-transform: uppercase;">
    </div>

    <div class="mb-3">
        <label class="form-label">Visibilidade</label>

        <select name="visibilidade" class="form-select">
            <option value="publica">🌐 Pública para todos</option>
            <option value="privada">🔒 Privada somente para mim</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Conteúdo</label>

        <div id="editor" style="height: 350px; background: white;"></div>

        <input type="hidden" name="conteudo" id="conteudo">
    </div>

    <button type="submit" class="btn btn-success">Salvar</button>
    <a href="/notas" class="btn btn-secondary">Cancelar</a>

</form>

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<script>
    function mostrarNovaCategoria() {
        const select = document.getElementById("categoria");
        const campo = document.getElementById("campoNovaCategoria");
        const input = document.getElementById("nova_categoria");

        if (select.value === "__nova__") {
            campo.style.display = "block";
            input.required = true;
            input.focus();
        } else {
            campo.style.display = "none";
            input.required = false;
            input.value = "";
        }
    }

    var quill = new Quill('#editor', {
        theme: 'snow',
        placeholder: 'Digite sua nota aqui ou cole um print com CTRL + V...',
        modules: {
            toolbar: [
                [{ 'header': [1, 2, 3, false] }],
                ['bold', 'italic', 'underline'],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                ['link'],
                ['clean']
            ]
        }
    });

    quill.root.addEventListener('paste', function(e) {
        var clipboard = e.clipboardData || window.clipboardData;

        if (!clipboard) {
            return;
        }

        var items = clipboard.items;

        for (var i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image') !== -1) {
                e.preventDefault();

                var arquivo = items[i].getAsFile();
                enviarImagem(arquivo);
            }
        }
    });

    function enviarImagem(arquivo) {
        var formData = new FormData();
        formData.append('upload', arquivo);

        fetch('/upload_imagem', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(resultado => {
            var range = quill.getSelection();

            if (!range) {
                range = { index: quill.getLength() };
            }

            quill.insertEmbed(range.index, 'image', resultado.url);
            quill.setSelection(range.index + 1);
        })
        .catch(error => {
            alert('Erro ao enviar imagem.');
            console.log(error);
        });
    }

    function salvarConteudo() {
        document.getElementById('conteudo').value = quill.root.innerHTML;
    }
</script>

{% endblock %}
