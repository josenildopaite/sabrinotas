{% extends "base.html" %}

{% block conteudo %}

<h3 class="mb-4">✏️ Editar Nota</h3>

<form method="POST" onsubmit="salvarConteudo()">

    <div class="mb-3">
        <label class="form-label">Título</label>
        <input type="text" name="titulo" class="form-control" value="{{ nota[1] }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Categoria</label>

        <select name="categoria" class="form-select" required>
            {% for categoria in categorias %}
                <option value="{{ categoria[0] }}" {% if categoria[0] == nota[2] %}selected{% endif %}>
                    {{ categoria[0] }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Texto</label>

        <div id="editor" style="height: 350px; background: white;"></div>

        <input type="hidden" name="texto" id="texto">
    </div>

    <button type="submit" class="btn btn-primary">
        Salvar Alterações
    </button>

    <a href="/nota/{{ nota[0] }}" class="btn btn-secondary">
        Cancelar
    </a>

</form>

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<script>
    var quill = new Quill('#editor', {
        theme: 'snow',
        placeholder: 'Digite sua nota aqui ou cole um print com CTRL + V...',
        modules: {
            toolbar: [
    [{ 'header': [1, 2, 3, false] }],
    ['bold', 'italic', 'underline'],
    [{ 'color': [] }, { 'background': [] }],
    [{ 'list': 'ordered' }, { 'list': 'bullet' }],
    ['link'],
    ['clean']
]
        }
    });

    quill.root.innerHTML = `{{ nota[3] | safe }}`;

    quill.root.addEventListener('paste', function(e) {
        var clipboard = e.clipboardData || window.clipboardData;

        if (!clipboard) {
            return;
        }

        var items = clipboard.items;

        for (var i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image') !== -1) {
                e.preventDefault();

                var arquivo = items[i].getAsFile();
                enviarImagem(arquivo);
            }
        }
    });

    function enviarImagem(arquivo) {
        var formData = new FormData();
        formData.append('upload', arquivo);

        fetch('/upload_imagem', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(resultado => {
            var range = quill.getSelection();

            if (!range) {
                range = { index: quill.getLength() };
            }

            quill.insertEmbed(range.index, 'image', resultado.url);
            quill.setSelection(range.index + 1);
        })
        .catch(error => {
            alert('Erro ao enviar imagem.');
            console.log(error);
        });
    }

    function salvarConteudo() {
        document.getElementById('texto').value = quill.root.innerHTML;
    }
</script>

{% endblock %}
